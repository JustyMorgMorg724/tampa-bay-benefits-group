<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tampa Bay Benefits Group | Justin Morgan</title>
  <meta name="description" content="Helping Tampa Bay businesses and families protect what matters most.">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #071f3d;
      font-family: Arial, Helvetica, sans-serif;
    }
    .site {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      background: #fff;
      line-height: 0;
    }
    .site img {
      display: block;
      width: 100%;
      height: auto;
    }
    .hotspot {
      position: absolute;
      display: block;
      z-index: 10;
      cursor: pointer;
      border-radius: 8px;
    }
    .hotspot:focus-visible {
      outline: 3px solid #fff;
      box-shadow: 0 0 0 6px #dca52a;
    }

    /* Navigation */
    .home      { left: 41.5%; top: 1.0%; width: 5.5%; height: 2.6%; }
    .benefits  { left: 47.2%; top: 1.0%; width: 7.4%; height: 2.6%; }
    .about     { left: 54.8%; top: 1.0%; width: 6.1%; height: 2.6%; }
    .resources { left: 61.0%; top: 1.0%; width: 8.3%; height: 2.6%; }
    .contact   { left: 69.7%; top: 1.0%; width: 7.0%; height: 2.6%; }

    /* CTA buttons */
    .schedule-top  { left: 77.7%; top: 0.8%; width: 19.0%; height: 3.3%; }
    .about-justin  { left: 11.2%; top: 54.8%; width: 12.5%; height: 2.4%; }
    .schedule-main { left: 65.2%; top: 87.1%; width: 23.2%; height: 4.2%; }

    /* Footer links */
    .phone {
      left: 35.7%; top: 93.0%; width: 15.5%; height: 1.8%;
    }
    .email {
      left: 35.7%; top: 94.7%; width: 25.0%; height: 1.8%;
    }
    .linkedin {
      left: 81.7%; top: 98.2%; width: 3.8%; height: 1.6%;
    }

    /* Scroll targets */
    .anchor {
      position: absolute;
      left: 0;
      width: 1px;
      height: 1px;
    }
    #top { top: 0; }
    #about-section { top: 31.5%; }
    #benefits-section { top: 61.0%; }
    #resources-section { top: 73.0%; }
    #contact-section { top: 90.0%; }

    @media (max-width: 700px) {
      body { background: #fff; }
      .site { max-width: none; }
    }
  </style>
</head>
<body>
  <main class="site">
    <span id="top" class="anchor"></span>
    <span id="about-section" class="anchor"></span>
    <span id="benefits-section" class="anchor"></span>
    <span id="resources-section" class="anchor"></span>
    <span id="contact-section" class="anchor"></span>

    <img src="assets/homepage.png" alt="Tampa Bay Benefits Group homepage featuring Justin Morgan">

    <a class="hotspot home" href="#top" aria-label="Home"></a>
    <a class="hotspot benefits" href="#benefits-section" aria-label="Benefits"></a>
    <a class="hotspot about" href="#about-section" aria-label="About"></a>
    <a class="hotspot resources" href="#resources-section" aria-label="Resources"></a>
    <a class="hotspot contact" href="#contact-section" aria-label="Contact"></a>

    <a class="hotspot schedule-top"
       href="mailto:JMorgan@tampabaybenefitsgroup.com?subject=Schedule%20a%20Consultation"
       aria-label="Schedule a consultation"></a>

    <a class="hotspot about-justin"
       href="#about-section"
       aria-label="About Justin Morgan"></a>

    <a class="hotspot schedule-main"
       href="mailto:JMorgan@tampabaybenefitsgroup.com?subject=Free%20Benefits%20Consultation"
       aria-label="Schedule your free consultation"></a>

    <a class="hotspot phone"
       href="tel:+19415452615"
       aria-label="Call Justin Morgan at 941-545-2615"></a>

    <a class="hotspot email"
       href="mailto:JMorgan@tampabaybenefitsgroup.com"
       aria-label="Email Justin Morgan"></a>

    <a class="hotspot linkedin"
       href="https://www.linkedin.com/in/justin-morgan-1374b6244"
       target="_blank" rel="noopener noreferrer"
       aria-label="Open Justin Morgan's LinkedIn profile"></a>
  </main>
</body>
</html>
